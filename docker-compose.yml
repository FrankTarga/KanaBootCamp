services:
  mock-receita:
    build: ./mock-receita
    container_name: antecipe-mock-receita
    environment:
      DATA_DIR: /data
      # gabarito (padrão, bate com resultado_esperado_100k.json) | kanastra (cnpj_situacao_mock.csv oficial) | formato
      SITUACAO_FONTE: ${SITUACAO_FONTE:-gabarito}
    volumes:
      - ./backend/data:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: antecipe-backend
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /app/data
      LOG_LEVEL: INFO
      RECEITA_API_URL: http://mock-receita:8001/api/cnpj/v1
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}  # sem .env tudo funciona, só o PUT das regras responde 403 (veja .env.example)
      # DATA_BASE_PADRAO: "22/10/2026"  # opcional: força a data-base (senão = D+1 útil da maior DATA_AQUISICAO)
    volumes:
      # Diretório inteiro montado: o PUT /validators grava com os.replace e persiste no host.
      - ./backend/data:/app/data
    depends_on:
      mock-receita:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # URL que o NAVEGADOR usa para chegar na API (na VPS, troque pelo IP/domínio público)
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    container_name: antecipe-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
